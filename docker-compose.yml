

services:
  postgres:
    image: postgres:16
    container_name: wituzbot_postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: wituzbot_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379

  base:
    build:
      context: .
      dockerfile: Dockerfile.base
    image: wituzbot-base:latest
    command: echo "Base image built successfully"
    restart: "no"

  
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: wituzbot_admin
    depends_on:
      base:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./static:/app/static  
    env_file:
      - .env
      - app/admin/.env
    restart: unless-stopped

  main-bot:
    build:
      context: .
      dockerfile: Dockerfile.mainbot
    container_name: wituzbot_main_bot
    depends_on:
      base:
        condition: service_completed_successfully
      admin:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
      - app/bot/.env
    restart: unless-stopped


  feedback-bot:
    build:
      context: .
      dockerfile: Dockerfile.feedback_bot
    container_name: wituzbot_feedback_bot
    depends_on:
      base:
        condition: service_completed_successfully
    restart: unless-stopped

 
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.admin  
    container_name: wituzbot_celery_worker
    command: celery -A reminder_system worker -P solo --loglevel=info --concurrency=2
    depends_on:
      base:
        condition: service_completed_successfully
      admin:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=1  # Allow celery to run as root in Docker
      - SKIP_MIGRATIONS=true
    volumes:
      - ./logs:/app/logs      # For celery logs
    restart: unless-stopped

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.admin  # Reuse admin dockerfile
    container_name: wituzbot_celery_beat
    command: celery -A reminder_system beat --loglevel=info --schedule=/app/data/schedule.db
    depends_on:
      base:
        condition: service_completed_successfully
      admin:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=1
      - SKIP_MIGRATIONS=true
    volumes:
      - ./logs:/app/logs
      - celery_beat_data:/app/data
    restart: unless-stopped

  

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  celery_beat_data:
    driver: local


  