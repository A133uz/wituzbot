

services:
  postgres:
    image: postgres:16
    container_name: postgres
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6381:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  redis-commander:
    image: rediscommander/redis-commander
    ports:
      - "8085:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
  
  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
    container_name: admin
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8008:8000"
    volumes:
      - ./app/admin:/app/app/admin 
      - ./templates:/app/templates
      - ./static:/app/static  
    env_file:
      - .env
      - app/admin/.env
    restart: unless-stopped

  main-bot:
    build:
      context: .
      dockerfile: Dockerfile.mainbot
    container_name: main_bot
    depends_on:
      admin:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app/bot:/app/app/bot
    env_file:
      - .env
      - app/bot/.env
    restart: unless-stopped


  feedback-bot:
    build:
      context: .
      dockerfile: Dockerfile.feedback_bot
    container_name: feedback_bot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app/feedback_bot:/app/app/feedback_bot
    env_file:
      - .env
      - app/feedback_bot/.env
    restart: unless-stopped

 
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.admin  
    container_name: celery_worker
    command: celery -A reminder_system worker -P solo --loglevel=info --concurrency=2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - C_FORCE_ROOT=1  
      - SKIP_MIGRATIONS=true
    volumes:
      - ./reminder_system.py:/app/reminder_system.py
      - ./logs:/app/logs     
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  celery_beat_data:
    driver: local


  